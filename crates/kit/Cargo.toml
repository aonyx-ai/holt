[package]
name = "holt-kit"

version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bon = "3.10.3"
getset = "0.1.7"
icondata = { version = "0.7.0", default-features = false, features = [
  "lucide",
] }
leptos = { workspace = true }
leptos-floating = "0.1.0"
leptos_icons = "0.7.0"
tailwind_fuse = { version = "0.3.0", features = ["variant"] }
web-sys = { version = "0.3.80", features = [
  "DomRect",
  "Element",
  "HtmlElement",
  "KeyboardEvent",
  "NodeList",
] }

[dev-dependencies]
console_log = "1.0"
console_error_panic_hook = "0.1.7"
log = "0.4.22"
web-sys = { version = "0.3.80", features = [
  "Document",
  "HtmlButtonElement",
  "HtmlDivElement",
  "HtmlElement",
  "NodeList",
  "Window",
] }
